spring.application.name=api-gateway

server.port=${SERVER_PORT:8090}

#============== Downstream services ===============#
app.auth-uri=${AUTH_URI:http://localhost:8081}
app.core-uri=${CORE_URI:http://localhost:8082}

#============== CORS ===============#
# Comma-separated list. Add the Firebase Hosting production URL alongside localhost for dev.
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

#============== Health (used by Cloud Run) ===============#
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
