spring.application.name=core-services

server.port=${SERVER_PORT:8082}

#============== Database Configuration ===============#
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/core_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:stallworks}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:stallworks}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.sql.init.mode=always

# Without this, exceptions thrown from service code (e.g. "A note
# explaining the discrepancy is required...", "Already clocked in today")
# get swallowed into a generic 500 body with no real message — same gap
# fixed on auth-service earlier, needed here too for these errors to
# actually reach the user instead of showing as unhelpful failures.
server.error.include-message=always

core-service.base-url=${CORE_SERVICE_URL:http://localhost:8082}

jwt.secret=${JWT_SECRET:Nb1Yu58c639tX1YM4Oo+M17TLw/MAPO836pEZ5eDV3+a2uThYOwJ3QE0yeguhIQDjP69t2Exe3sdd9+F4/Fi3Q==}

